name: build

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      
      - name: Install dependencies
        run: pnpm install

      - name: Build web assets
        run: pnpm run build

      - name: Sync web assets
        run: pnpm run sync

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Calculate Version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "Calculated Version: $VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
         gradle-version: wrapper

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign
        # r0adkll/sign-android-release cannot be upgraded: v1 is the only published
        # release (runs on Node 12 and uses the deprecated set-output command inside).
        # Its unreleased master branch still calls core.setOutput, so the set-output
        # deprecation warning cannot be eliminated; keep @v1.
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          mv app-release-unsigned-signed.apk legero-${{ env.VERSION_NAME }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: legero-${{ env.VERSION_NAME }}
          path: "android/app/build/outputs/apk/release/legero-${{ env.VERSION_NAME }}.apk"
      