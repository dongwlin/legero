name: build

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      
      - name: Install dependencies
        run: pnpm install

      - name: Build web assets
        run: pnpm run build

      - name: Sync web assets
        run: pnpm run sync

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Calculate Version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "Calculated Version: $VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
         gradle-version: wrapper

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        # Manual replacement for r0adkll/sign-android-release@v1 (last release 2019,
        # its master branch still uses the deprecated set-output command, so the
        # action cannot be used warning-free). Equivalent flow: zipalign check ->
        # apksigner sign -> apksigner verify, producing the same output filename.
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android/app/build/outputs/apk/release
          echo "$SIGNING_KEY" | base64 -d > signingKey.jks
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 app-release-unsigned.apk
          KEY_PASS_ARGS=()
          if [ -n "$KEY_PASSWORD" ]; then
            KEY_PASS_ARGS=(--key-pass "pass:$KEY_PASSWORD")
          fi
          "$BUILD_TOOLS/apksigner" sign \
            --ks signingKey.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            "${KEY_PASS_ARGS[@]}" \
            --out app-release-unsigned-signed.apk \
            app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify app-release-unsigned-signed.apk
          rm -f signingKey.jks

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          mv app-release-unsigned-signed.apk legero-universal-${{ env.VERSION_NAME }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: legero-universal-${{ env.VERSION_NAME }}
          path: "android/app/build/outputs/apk/release/legero-universal-${{ env.VERSION_NAME }}.apk"

      - name: Create GitHub Release
        # Only publish a release when a version tag (v*) is pushed.
        # gh CLI is pre-installed on GitHub-hosted runners; GITHUB_TOKEN is
        # automatically provisioned with contents: write permissions.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android/app/build/outputs/apk/release
          gh release create "${{ github.ref_name }}" \
            "legero-universal-${{ env.VERSION_NAME }}.apk" \
            --generate-notes
      